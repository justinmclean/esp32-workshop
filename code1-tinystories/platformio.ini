; TinyStories LLM on the M5Stack CoreS3 / CoreS3 SE.
; Ported from github.com/slvDev/esp32-ai firmware/esp32_tinystories.
;
; First time on a board, both steps (model is about 15 MB, takes a minute or two):
;   pio run -t uploadmodel     ; writes model/model.bin to the 'model' partition
;   pio run -t upload          ; builds and writes the firmware
;   pio device monitor
; Afterwards only firmware changes need `pio run -t upload`.

[env:cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

build_unflags = -Os
build_flags =
    -O3
    -DBOARD_HAS_PSRAM

lib_deps =
    m5stack/M5Unified

monitor_speed = 115200
extra_scripts = post:tools/model_upload.py

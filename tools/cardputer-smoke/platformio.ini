; Trainer smoke test for the M5Stack Cardputer Adv (ESP32-S3, 8 MB flash, no PSRAM).
; Checks the parts of the workshop stack a Cardputer can exercise:
; SD card, mic and speaker, WiFi, and the secure WebSocket to ElevenLabs.
;
;   pio run -t upload && pio device monitor
;
; Uses secrets.h from the repo root and ws_client.h from code2-harness.

[env:cardputer]
platform = espressif32
board = m5stack-cardputer
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1   ; print library errors, such as why the SD card did not mount
    -I${PROJECT_DIR}/../..
    -I${PROJECT_DIR}/../../code2-harness/include

lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson

monitor_speed = 115200

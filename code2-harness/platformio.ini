; Code 2: main harness for the M5Stack CoreS3 / CoreS3 SE.
; Touch menu, WiFi scan / connect / disconnect, voice record and playback on SD.
;
;   pio run -t upload
;   pio device monitor
;
; Needs secrets.h in the repo root (copy secrets.example.h).

[env:cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -I${PROJECT_DIR}/..

lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson

monitor_speed = 115200
